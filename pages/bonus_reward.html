<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>额外加赠奖励</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* 道具格子（完全复刻buy_success.html） */
.item-slot{position:absolute;width:200px;height:200px;opacity:0;transform:scale(1.5)}
.item-slot .slot-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.item-slot .item-img{position:absolute;inset:15px;width:calc(100% - 30px);height:calc(100% - 30px);object-fit:contain;display:block;z-index:2;}
.item-slot .item-name{position:absolute;left:-50px;right:-50px;top:210px;text-align:center;font-size:24px;font-weight:bold;color:#000;text-shadow:0 0 3px #fff,0 0 6px #fff;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 飞入动画（完全复刻buy_success.html：0.5s） */
.item-slot.fly-in{animation:flyIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards}
/* 紫色品质光晕（完全复刻buy_success.html） */
.item-slot.quality-purple::after{content:'';position:absolute;inset:-20px;border-radius:12px;background:radial-gradient(circle,rgba(200,150,255,0.9),rgba(160,100,255,0.4) 40%,transparent 70%);animation:glowPurple 0.8s ease-out forwards;pointer-events:none}
/* 金色品质（完全复刻buy_success.html） */
@property --gold-angle{
  syntax:'<angle>';
  initial-value:0deg;
  inherits:false;
}
.item-slot.quality-gold.fly-in{animation:flyInGold 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards}
.item-slot.quality-gold::before{content:'';position:absolute;inset:-15px;border-radius:6px;background:radial-gradient(circle,rgba(255,220,100,1),rgba(255,180,50,0.6) 30%,rgba(255,150,0,0.3) 60%,transparent 80%);animation:glowGold 1.2s ease-out forwards;pointer-events:none}
.item-slot.quality-gold::after{content:'';position:absolute;inset:-12px;border-radius:6px;background:conic-gradient(from var(--gold-angle),transparent,rgba(255,215,0,0.28),transparent 25%,rgba(255,215,0,0.28),transparent 50%,rgba(255,215,0,0.28),transparent 75%,rgba(255,215,0,0.28),transparent);animation:rotateGoldAngle 5s linear infinite;pointer-events:none}
/* 金色粒子 */
.gold-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.gold-particle{position:absolute;width:6px;height:6px;background:radial-gradient(circle,#ffd700,#ff8c00);border-radius:50%;animation:particleFloat 1.5s ease-out forwards}
@keyframes flyIn{
  0%{opacity:0;transform:scale(2) translateY(-40px)}
  30%{opacity:1;transform:scale(1.1) translateY(0)}
  60%{transform:scale(0.95)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes flyInGold{
  0%{opacity:0;transform:scale(2.5) translateY(-50px) rotate(-10deg)}
  20%{opacity:1;transform:scale(1.2) translateY(0) rotate(5deg)}
  50%{transform:scale(0.9) rotate(-3deg)}
  80%{transform:scale(1.05) rotate(1deg)}
  100%{opacity:1;transform:scale(1) translateY(0) rotate(0)}
}
@keyframes glowPurple{
  0%{opacity:0;transform:scale(1.5)}
  30%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:scale(1)}
}
@keyframes glowGold{
  0%{opacity:0;transform:scale(2)}
  20%{opacity:1;transform:scale(1.5)}
  50%{opacity:0.8;transform:scale(1.3)}
  100%{opacity:0;transform:scale(1)}
}
@keyframes rotateGoldAngle{
  to{--gold-angle:360deg}
}
@keyframes particleFloat{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
}
/* 确认按钮（完全复刻buy_success.html） */
.confirm-btn{position:absolute;left:35%;top:75%;width:30%;height:12%;background:transparent;border:none;cursor:pointer;z-index:100}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
  <script src="../data/item_base_name_map.js"></script>
<script src="../data/item_mapping.js"></script>
  <script src="../data/item_box_config.js"></script>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-img" src="../images/common/pages/decompose/single_bg.png" alt="背景">
  <div id="slotsContainer"></div>
  <button class="confirm-btn" id="confirmBtn"></button>
</div>
<script>

// 盒子函数：根据道具名称和图片类型获取图片路径
// 支持带数量的道具名称，如"近战夺宝积分×3"、"200钻石宝箱"
function getItemImage(itemName, type) {
  if(!itemName) return '';
  // 1. 先查映射表（处理特殊格式，如"200钻石宝箱" → "钻石宝箱"）
  if(window.ITEM_BASE_NAME_MAP && window.ITEM_BASE_NAME_MAP[itemName]){
    var baseName = window.ITEM_BASE_NAME_MAP[itemName];
    return '../images/items_box/' + baseName + '/' + type + '.png';
  }
  // 2. 再用正则去掉末尾的×数字（处理标准格式，如"近战夺宝积分×3" → "近战夺宝积分"）
  var cleanName = itemName.replace(/[×*]\d+$/, '');
  return '../images/items_box/' + cleanName + '/' + type + '.png';
}

// ===== 点击音效（完全复刻buy_success.html） =====
var clickAudioPool = [];
var clickAudioIndex = 0;
for(var i = 0; i < 5; i++){
  var ca = new Audio('../audio/gacha/click.m4a');
  ca.preload = 'auto';
  clickAudioPool.push(ca);
}
function playClickSound(){
  try{
    var audio = clickAudioPool[clickAudioIndex];
    clickAudioIndex = (clickAudioIndex + 1) % 5;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 点击音效结束 =====


// ===== 恭喜获得页面音效（完全复刻buy_success.html） =====
var rewardAudioPool = [];
var rewardAudioIndex = 0;
for(var i = 0; i < 3; i++){
  var ra = new Audio('../audio/gacha/reward.m4a');
  ra.preload = 'auto';
  rewardAudioPool.push(ra);
}
function playRewardSound(){
  try{
    var audio = rewardAudioPool[rewardAudioIndex];
    rewardAudioIndex = (rewardAudioIndex + 1) % 3;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 恭喜获得页面音效结束 =====

// 品质槽背景图映射（完全复刻buy_success.html）


// 单抽格子位置（完全复刻buy_success.html）
var singlePosition = {x:1070, y:440};

// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

var slotsContainer = document.getElementById('slotsContainer');

// 金色粒子（完全复刻buy_success.html）
function createGoldParticles(slot){
  var particles = document.createElement('div');
  particles.className = 'gold-particles';
  for(var i = 0; i < 12; i++){
    var p = document.createElement('div');
    p.className = 'gold-particle';
    p.style.left = (40 + Math.random() * 120) + 'px';
    p.style.top = (40 + Math.random() * 120) + 'px';
    p.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
    p.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    particles.appendChild(p);
  }
  slot.appendChild(particles);
}

// 创建道具格子（完全复刻buy_success.html）
function createSlot(x, y, item){
  if(!item) return null;
  var it = item;
  var q = it.quality || 'purple';
  var slot = document.createElement('div');
  slot.className = 'item-slot quality-' + q;
  slot.style.left = x + 'px';
  slot.style.top = y + 'px';
  var slotBg = document.createElement('img');
  slotBg.className = 'slot-bg';
  slotBg.src = SLOT_IMAGES[q];
  slot.appendChild(slotBg);
  // 道具图片
  if(it.name || it.image){
    var itemImg = document.createElement('img');
    itemImg.className = 'item-img';
    if(it.image){
      itemImg.src = it.image;
    }
    slot.appendChild(itemImg);
  }
  // 道具名称
  var itemName = document.createElement('div');
  itemName.className = 'item-name';
  itemName.textContent = it.name || '';
  slot.appendChild(itemName);
  if(q === 'gold') createGoldParticles(slot);
  slot.item = it;
  return slot;
}

// 当前奖励
var currentReward = null;

// 显示奖励（完全复刻buy_success.html的setBuyReward处理逻辑）
function showReward(item){
  currentReward = item;
  // playRewardSound(); // 播放恭喜获得页面音效 // 已移到主页面播放，避免重音
  // 显示奖励
  slotsContainer.innerHTML = '';
  var slot = createSlot(singlePosition.x, singlePosition.y, item);
  if(slot){
    slotsContainer.appendChild(slot);
    // 出现延迟：100ms（完全复刻buy_success.html）
    setTimeout(function(){
      slot.classList.add('fly-in');
    }, 100);
  }
}

// 确认按钮关闭
document.getElementById('confirmBtn').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  window.parent.postMessage({type:'bonusRewardConfirm', item: currentReward}, '*');
});

// 监听ESC键
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    window.parent.postMessage({type:'bonusRewardConfirm', item: currentReward}, '*');
  }
});

// 监听父页面的消息，接收奖励
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'setBonusReward' && e.data.item){
    showReward(e.data.item);
  }
});

// 页面加载完成后播放恭喜获得页面音效（和buy_success.html完全一样）
window.onload = function(){
  // 预加载模式检查
  try {
    var urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('preload') === '1'){
      console.log('[预加载模式] bonus_reward 不执行自动逻辑');
      return;
    }
  } catch(e){}
  // playRewardSound(); // 播放恭喜获得页面音效 // 已移到主页面播放，避免重音
};
</script>

<script>

// 盒子函数：根据道具名称和图片类型获取图片路径
function getItemImage(itemName, type) {
  return '../images/items_box/' + itemName + '/' + type + '.png';
}

// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>

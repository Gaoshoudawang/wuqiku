<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>分解成功</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* 道具格子 */
.item-slot{position:absolute;width:300px;height:300px;left:50%;top:40%;transform:translate(-50%,-50%) scale(1.5);opacity:0}
.item-slot .slot-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.item-slot .item-img{position:absolute;inset:30px;width:calc(100% - 60px);height:calc(100% - 60px);object-fit:contain;display:block;z-index:2}
.item-slot .item-name{position:absolute;left:-60px;right:-60px;top:320px;text-align:center;font-size:36px;font-weight:bold;color:#000;text-shadow:0 0 3px #fff,0 0 6px #fff;z-index:3;white-space:nowrap}
/* 飞入动画 */
.item-slot.fly-in{animation:flyIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes flyIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(2) translateY(-60px)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.1) translateY(0)}
  60%{transform:translate(-50%,-50%) scale(0.95)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0)}
}
/* 金色品质光晕 */
.item-slot.quality-purple::before{content:'';position:absolute;inset:-20px;border-radius:12px;background:radial-gradient(circle,rgba(180,100,255,1),rgba(150,80,220,0.6) 30%,rgba(120,60,200,0.3) 60%,transparent 80%);animation:glowPurple 1.2s ease-out forwards;pointer-events:none}
@keyframes glowPurple{
  0%{opacity:0;transform:scale(2)}
  20%{opacity:1;transform:scale(1.5)}
  50%{opacity:0.8;transform:scale(1.3)}
  100%{opacity:0;transform:scale(1)}
}

/* 确认按钮 */
.confirm-btn{position:absolute;left:40%;top:78%;width:20%;height:10%;background:transparent;border:none;cursor:pointer;z-index:100}

/* 禁止长按查看图片/保存图片 */
img{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
/* 禁止全局右键菜单 */
*{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-img" src="../images/common/pages/decompose/single_bg.png" alt="背景">
  <div id="slotsContainer"></div>
  <button class="confirm-btn" id="confirmBtn"></button>
</div>
<script>

// ===== 点击音效 =====
var clickAudioPool = [];
var clickAudioIndex = 0;
for(var i = 0; i < 5; i++){
  var ca = new Audio('../audio/gacha/click.m4a');
  ca.preload = 'auto';
  clickAudioPool.push(ca);
}
function playClickSound(){
  try{
    var audio = clickAudioPool[clickAudioIndex];
    clickAudioIndex = (clickAudioIndex + 1) % 5;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 点击音效结束 =====


// ===== 恭喜获得页面音效 =====
var rewardAudioPool = [];
var rewardAudioIndex = 0;
for(var i = 0; i < 3; i++){
  var ra = new Audio('../audio/gacha/reward.m4a');
  ra.preload = 'auto';
  rewardAudioPool.push(ra);
}
function playRewardSound(){
  try{
    var audio = rewardAudioPool[rewardAudioIndex];
    rewardAudioIndex = (rewardAudioIndex + 1) % 3;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 恭喜获得页面音效结束 =====

// 近战夺宝积分黑色小方块图片（紫色品质）
var SLOT_BG = '../images/common/slot/purple.png';

// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// 获取URL参数中的积分数量
function getPointsFromUrl(){
  var url = new URL(window.location.href);
  var points = url.searchParams.get('points');
  console.log('URL points参数:', points);
  console.log('完整URL:', window.location.href);
  return parseInt(points) || 0;
}

// 显示奖励
function showReward(){
  // playRewardSound(); // 已移到主页面播放，避免重音
  var points = getPointsFromUrl();
  var container = document.getElementById('slotsContainer');
  
  var slot = document.createElement('div');
  slot.className = 'item-slot quality-purple';
  
  var slotBg = document.createElement('img');
  slotBg.className = 'slot-bg';
  slotBg.src = SLOT_BG;
  slot.appendChild(slotBg);
  
  // 盒子架构：从ITEM_BEHAVIOR读取积分道具名称，再从映射表读取图片，不硬编码
  var pointsBaseName = '';
  var pointsImgSrc = '';
  
  // 从ITEM_BEHAVIOR读取积分道具基础名称
  if(window.ITEM_BEHAVIOR){
    for(var key in window.ITEM_BEHAVIOR){
      if(window.ITEM_BEHAVIOR[key].gacha_behavior === 'points' && window.ITEM_BEHAVIOR[key].points_type === 'exchange'){
        var name = key;
        var xIndex = name.indexOf('×');
        if(xIndex !== -1){
          pointsBaseName = name.substring(0, xIndex);
        }else{
          pointsBaseName = name;
        }
        break;
      }
    }
  }
  
  // 用盒子函数读取积分道具小图
  if(pointsBaseName){
    pointsImgSrc = getItemImage(pointsBaseName, 'small');
  }
  
  // 近战夺宝积分图案
  var itemImg = document.createElement('img');
  itemImg.className = 'item-img';
  itemImg.src = pointsImgSrc;
  slot.appendChild(itemImg);
  
  var itemName = document.createElement('div');
  itemName.className = 'item-name';
  itemName.textContent = pointsBaseName + '×' + points;
  slot.appendChild(itemName);
  
  container.appendChild(slot);
  
  // 延迟添加飞入动画
  setTimeout(function(){
    slot.classList.add('fly-in');
  }, 500);
}

// 确认按钮关闭
document.getElementById('confirmBtn').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  window.parent.postMessage({type:'closeDecomposeReward'}, '*');
});

// 页面加载完成后显示奖励
window.onload = function(){
  showReward();
};
</script>

<script>

// 盒子函数：根据道具名称和图片类型获取图片路径
// 支持带数量的道具名称，如"近战夺宝积分×3"、"200钻石宝箱"
function getItemImage(itemName, type) {
  if(!itemName) return '';
  // 1. 先查映射表（处理特殊格式，如"200钻石宝箱" → "钻石宝箱"）
  if(window.ITEM_BASE_NAME_MAP && window.ITEM_BASE_NAME_MAP[itemName]){
    var baseName = window.ITEM_BASE_NAME_MAP[itemName];
    return '../images/items_box/' + baseName + '/' + type + '.png';
  }
  // 2. 再用正则去掉末尾的×数字（处理标准格式，如"近战夺宝积分×3" → "近战夺宝积分"）
  var cleanName = itemName.replace(/[×*]\d+$/, '');
  return '../images/items_box/' + cleanName + '/' + type + '.png';
}

// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
